<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mflux{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="{{ page }}">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>mflux</a>
    {% if page not in ("login", "setup") %}
    <nav class="tabs">
      <a href="/" class="{{ 'active' if page == 'generate' }}">Generate</a>
      <a href="/gallery" class="{{ 'active' if page == 'gallery' }}">Gallery</a>
    </nav>
    <div class="topbar-right">
      {% if page == "generate" %}
      <button id="topbar-generate" class="primary small" type="button" title="Generate (⌘/Ctrl + Enter)" form="generate-form">Generate</button>
      {% endif %}
      <span id="worker-status" class="pill muted">idle</span>
      <button id="unload-model" class="ghost small" type="button" title="Free the loaded model's memory now" hidden>Unload</button>
      <button id="logout" class="ghost small" hidden>Log out</button>
    </div>
    {% endif %}
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
